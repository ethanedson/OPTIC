<!DOCTYPE html>
<html>
  <head>
    <title>Optic</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <div class="flex-container">
      <div class="flex-container-left">
        <img src="icons/icon48.png" style="width:30px;height:30px;margin-top:-8px;margin-left:-2px">
        <h1 style="margin-top:-2px;margin-left:5px">OPTIC</h1>
      </div>
      <div class="flex-container-right">
        <i id="status" style="margin-top:2px; margin-right:5px; font-size:12px; color: #868686;"></i>
        <button id="coffee" style="margin-top:-11px;margin-right:0px;width:160px;height:35px" title="Buy Developer a Coffee!">
          <img src="icons/Gumroad.png" style="height:29px;width:154px">
        </button>
        <button id="capture" style="margin-top:-11px;margin-right:0px;width:35px;height:35px" title="Connect Camera">
          <img src="icons/Connect.png" style="width:29px;height:29px;">
        </button>
        <button id="flip" style="margin-top:-11px;margin-right:0px; width:35px;height:35px" title="Change Camera">
          <img src="icons/CameraChange.png" style="width:29px;height:29px;">
        </button>
        <button id="settings" style="margin-top:-11px; margin-right:-12px; width:35px;height:35px" title="App Settings">
          <img src="icons/Settings.png" style="width:29px;height:29px;">
        </button>
      </div>
    </div>
    <div class="main-content">
      <div class="video-column">
        <video id="video" width="713" height="535" style="display:none" autoplay></video>
        <div class="canvas-container">
          <canvas id="canvas" width="713" height="535" style="background-color: black;"></canvas>
        </div>
      </div>
      <div class="controls-column">
        <div class="controls-body">
          <div class="controls-toolbar">
            <select name="templates" id="templates" class="templates-select">
              <option value="default">Default</option>
              <option value="bw">Black & White</option>
              <option value="sepia">Sepia</option>
              <option value="custom1">Custom 1</option> 
              <option value="custom2">Custom 2</option>
              <option value="custom3">Custom 3</option>
              <option value="custom4">Custom 4</option>
            </select>
            <button id="save" class="save-button" title="Save Configuration">
              <img src="icons/Save.png" alt="Save" class="save-icon">
            </button>
            <button id="config" class="save-button" title="Save Configuration">
              <!-- <img src="icons/Save.png" alt="Save" class="save-icon"> -->
               ^
            </button>
          </div>
          <div id="constraintControls" class="controls-list"></div>
        </div>
      </div>
    </div>
    <img id='standbyImage' src="icons/Standby.png" style="display:none">
    <script src="popup.js"></script>
  </body>
</html>
